[package]
name = "zsh-turbo"
version = "0.1.0"
edition = "2024"
description = "High-performance zsh enhancement tool: prompt, autosuggestions, syntax highlighting, and completions in a single Rust binary"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
