[package]
name = "zsh-turbo"
version = "26.10.100"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/owayo/zsh-turbo"
license = "MIT"
description = "High-performance zsh enhancement tool: prompt, autosuggestions, syntax highlighting, and completions in a single Rust binary"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
dirs = "7.0.0"
iana-time-zone = "0.1.65"
json5 = "1.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
serde_yaml_ng = "0.10.0"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
